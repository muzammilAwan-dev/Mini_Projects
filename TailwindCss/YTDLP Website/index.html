<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/output.css" />
    <title>YT Downloader Pro</title>
  </head>
  <body class="bg-zinc-950 text-gray-100 font-sans">
    <header>
        <nav
      class="fixed top-0 left-0 right-0 z-30 border-b border-white/5 bg-zinc-900/80"
    >
      <div class="max-w-7xl mx-auto px-4 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <!-- Logo -->
          <a href="#" class="flex items-center gap-2">
            <img
              src="./assets/main_icon.webp"
              alt="YT Downloader Pro"
              class="w-8 h-8 rounded-lg"
            />
            <span>YT Downloader Pro</span>
          </a>

          <!-- Navigation -->
          <div class="hidden md:flex items-center gap-1">
            <a
              href="#features"
              class="px-3 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition"
            >
              Features
            </a>

            <a
              href="#screenshots"
              class="px-3 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition"
            >
              Screenshots
            </a>

            <a
              href="#how-it-works"
              class="px-3 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition"
            >
              How it Works
            </a>

            <a
              href="#privacy"
              class="px-3 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition"
            >
              Privacy
            </a>

            <a
              href="#faq"
              class="px-3 py-2 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 transition"
            >
              FAQ
            </a>
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-3">
            <a
              href="#"
              class="hidden sm:inline-flex items-center gap-2 px-3.5 py-2 text-sm font-medium text-gray-300 bg-white/5 border border-white/10 rounded-lg hover:bg-white/10 hover:text-white transition"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.23c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.92 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23.96-.27 1.98-.4 3-.4s2.04.14 3 .4c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.2.69.8.58A12 12 0 0 0 24 12C24 5.37 18.63 0 12 0Z"
                />
              </svg>
              Star
            </a>

            <button
              class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-red-600 hover:bg-red-500 rounded-lg transition duration-200"
            >
            <svg
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v13m0 0 4-4m-4 4-4-4M5 21h14"
              />
            </svg>
              Download
            </button>
          </div>
        </div>
      </div>
    </nav>
    </header>

    <section class=" min-h-screen flex items center">
  <div class=" w-full flex justify-center px-6 lg:px-8 ">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center ">

      <!-- Left content -->
      <div class="">

        <span class="">
          Windows 10/11 • Powered by yt-dlp
        </span>

        <h1 class="">
          Download YouTube videos
          <span class="">
            in any quality.
          </span>
        </h1>

        <p class="">
          A premium Chrome extension + native Windows host
          that turns YouTube into your personal media library.
        </p>

        <div class=" flex-col sm:flex-row ">
          <button class="">
            Download Now
          </button>

          <a href="#" class="">
            Source Code
          </a>
        </div>

      </div>

      <!-- Right preview -->
      <div class="">
        Product Preview
      </div>

    </div>

  </div>
</section>


  </body>
</html>
